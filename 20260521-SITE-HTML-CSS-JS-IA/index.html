<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Site</title>

    <!-- Ligação com o CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOPO -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo da empresa">
            <span>Minha Empresa</span>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main>

        <!-- MENU LATERAL -->
        <aside class="menu">
            <button onclick="mostrarConteudo('quemSomos')">🏢 Quem Somos</button>
            <button onclick="mostrarConteudo('servicos')">🛠 Serviços</button>
            <button onclick="mostrarConteudo('produtos')">🛒 Produtos</button>
            <button onclick="mostrarConteudo('contato')">📞 Contato</button>
        </aside>

        <!-- CONTEÚDO -->
        <section class="conteudo" id="conteudo">
            <h2>Bem-vindo!</h2>
            <p>Selecione uma opção do menu para visualizar o conteúdo.</p>
        </section>

    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>Email: contato@empresa.com</p>
        <p>Endereço: Rua Central, 100</p>
        <p>Telefone: (41) 99999-9999</p>

        <div class="redes-sociais">
            <p>Redes sociais:</p>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">WhatsApp</a>
        </div>
    </footer>

    <!-- Ligação com JavaScript -->
    <script src="script.js"></script>

</body>
</html>
