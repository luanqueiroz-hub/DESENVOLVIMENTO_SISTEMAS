<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Produto Profissional</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte moderna e limpa -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <!-- AQUI FICA A FOTO DO SEU PRODUTO -->
        <!-- Substitua o link abaixo pelo caminho da sua imagem local ou URL da internet -->
        <img src="nike.jpg" alt="Tênis Runner Pro" class="product-image">
        
        <div class="product-info">
            <span class="tag-destaque">Destaque da Semana</span>
            <h3>Tênis Runner Pro</h3>
            <p class="preco">R$ 999,90</p>
        </div>
        
        <button class="btn">Comprar</button>
    </div>

</body>
</html>
