<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegação Corporativa</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte geométrica e limpa altamente recomendada para interfaces sérias -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar-wrapper">
        <nav class="navbar">
            <!-- Logo / Identidade Visual à esquerda -->
            <div class="nav-logo">
                <span>PROJETOS</span>
            </div>

            <!-- Links de navegação usando Flexbox como no seu slide -->
            <div class="nav-links">
                <a href="#" class="nav-item active">Início</a>
                <a href="#" class="nav-item">Sobre</a>
                <a href="#" class="nav-item">Projetos</a>
                <a href="#" class="nav-item">Contato</a>
            </div>

            <!-- Botão de ação (Call to Action) à direita para visual corporativo -->
            <div class="nav-actions">
                <button class="btn-primary">Começar</button>
            </div>
        </nav>
    </header>

</body>
</html>
