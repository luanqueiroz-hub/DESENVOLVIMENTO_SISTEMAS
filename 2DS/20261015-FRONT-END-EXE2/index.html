<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Profissional - Caldo de Cana</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importação de fonte profissional e moderna do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cardapio-card">
        <header class="cardapio-header">
            <h1>CALDO DO BAGAÇO</h1>
            <p>MENU</p>
        </header>
        
        <div class="cardapio-content">
            <!-- Item 1 -->
            <div class="item">
                <div class="item-detalhes">
                    <span class="nome-produto">Caldo de Cana Tradicional</span>
                    <span class="descricao">300ml</span>
                </div>
                <span class="preco">R$ 60,00</span>
            </div>

            <!-- Item 2 -->
            <div class="item">
                <div class="item-detalhes">
                    <span class="nome-produto">Caldo de Cana com Limão</span>
                    <span class="descricao">500ml</span>
                </div>
                <span class="preco">R$ 80,00</span>
            </div>

            <!-- Item 3 -->
            <div class="item">
                <div class="item-detalhes">
                    <span class="nome-produto">Caldo de Cana com Abacaxi</span>
                    <span class="descricao">500ml</span>
                </div>
                <span class="preco">R$ 90,00</span>
            </div>

            <!-- Item 4 -->
            <div class="item">
                <div class="item-detalhes">
                    <span class="nome-produto">Pastel Especial da Casa</span>
                    <span class="descricao">Frito na hora e muito bem recheado</span>
                </div>
                <span class="preco">R$ 200,00</span>
            </div>
        </div>
    </div>

</body>
</html>
