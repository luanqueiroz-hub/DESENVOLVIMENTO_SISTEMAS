<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Energy Style</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-card">
        <div class="brand-title">BEM-VINDO NOVAMENTE</div>
        
        <form>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>
    </div>

</body>
</html>
