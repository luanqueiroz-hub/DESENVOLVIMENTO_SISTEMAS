<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escola</title>

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background-color: #f2f2f2;
text-align: center;
}

header {
background-color: #004aad;
color: white;
padding: 25px;
}

nav {
background-color: #333;
padding: 15px;
}

nav a {
color: white;
text-decoration: none;
margin: 0 20px;
font-weight: bold;
}

.principal {
background-color: white;
width: 80%;
margin: 30px auto;
padding: 25px;
border-radius: 10px;
}

form {
margin-top: 20px;
}

input {
padding: 10px;
margin: 8px;
width: 250px;
}

button {
background-color: #004aad;
color: white;
padding: 10px 25px;
border: none;
border-radius: 5px;
cursor: pointer;
}

button:hover {
background-color: #00327a;
}

#mensagem {
margin-top: 15px;
font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>Colégio Estadual do Paraná</h1>
</header>

<nav>
<a href="#">Início</a>
<a href="#">Cursos</a>
<a href="#">Contato</a>
</nav>

<div class="principal">
<h2>Cadastro de Aluno</h2>

<form onsubmit="validarFormulario(event)">
<input type="text" id="nome" placeholder="Nome">
<br>
<input type="email" id="email" placeholder="E-mail">
<br>
<button type="submit">Enviar</button>
</form>

<p id="mensagem"></p>
</div>

<script>
function validarFormulario(event) {
event.preventDefault();

const nome = document.getElementById("nome").value;
const email = document.getElementById("email").value;
const mensagem = document.getElementById("mensagem");

if (nome === "" || email === "") {
mensagem.style.color = "red";
mensagem.textContent = "Erro: preencha os campos Nome e E-mail.";
} else {
mensagem.style.color = "green";
mensagem.textContent = "Cadastro realizado com sucesso!";
}
}
</script>

</body>
</html>
