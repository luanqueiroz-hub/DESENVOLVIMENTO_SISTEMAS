<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
table{
width: 80%;
border-collapse: collapse;
margin: auto;
font-family: Arial;
}

caption{
font-size: 24px;
margin: 10px;
font-weight: bold;
}

th{
background-color: #222;
color: white;
padding: 12px;
}

td{
border: 1px solid #999;
padding: 10px;
text-align: center;
}

tr:nth-child(even){
background-color: #f0f0f0;
}

tr:hover{
background-color: lightblue;
}

.formulario{
width: 80%;
margin: 20px auto;
font-family: Arial;
}

input{
padding: 8px;
margin: 5px;
}

button{
padding: 8px 15px;
background-color: #222;
color: white;
border: none;
cursor: pointer;
}

button:hover{
background-color: #444;
}
</style>

<title>Tabela HTML5</title>
</head>

<body>

<!-- FORMULÁRIO -->
<div class="formulario">
<input type="text" id="produto" placeholder="Digite o produto">

<input type="number" id="quantidade" placeholder="Digite a quantidade">

<input type="text" id="local" placeholder="Digite o local">

<button onclick="adicionaProduto()">
Adicionar

</div>

<!-- TABELA -->
<table>

<tr>

<th>Quantidade</th>

</tr>
</thead>

</tr>

</tr>

</tbody>
</table>

</body>
</html>
