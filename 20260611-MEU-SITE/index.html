<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Modelo de Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOPO -->
    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo da TechStore">
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main>

        <!-- MENU LATERAL -->
        <aside class="menu">
            <button onclick="mostrarConteudo('quemSomos')">🏢 Quem Somos</button>
            <button onclick="mostrarConteudo('servicos')">🛠️ Serviços</button>
            <button onclick="mostrarConteudo('produtos')">🛒 Produtos</button>
            <button onclick="mostrarConteudo('contato')">✉️ Contato</button>
        </aside>

        <!-- CONTEÚDO -->
        <section class="conteudo" id="conteudo">
            <h2>Bem-vindo!</h2>
            <p>Selecione uma opção do menu.</p>
            <p>Este site foi criado usando HTML, CSS e JavaScript.</p>
        </section>

    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 TechStore | Email: luan@techstore.com | Telefone: (41) 99730-6937</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
