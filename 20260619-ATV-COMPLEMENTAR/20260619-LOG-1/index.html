<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade: Matriz</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Estilo da tabela que mostra a matriz */
        table {
            margin: 20px auto;
            border-collapse: collapse;
        }

        td {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #ccc;
        }

        /* Cor especial para destacar a diagonal principal */
        .diagonal-destaque {
            background-color: #4caf50;
            color: white;
            border-color: #388e3c;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Matriz 3x3</h2>
        
        <table>
            <tr>
                <td id="celula-0-0">10</td>
                <td id="celula-0-1">20</td>
                <td id="celula-0-2">30</td>
            </tr>
            <tr>
                <td id="celula-1-0">40</td>
                <td id="celula-1-1">50</td>
                <td id="celula-1-2">60</td>
            </tr>
            <tr>
                <td id="celula-2-0">70</td>
                <td id="celula-2-1">80</td>
                <td id="celula-2-2">90</td>
            </tr>
        </table>

        <button onclick="analisarMatriz()">Mostrar Diagonal Principal</button>

        <div id="resultado"></div>
    </div>

    <script>
        function analisarMatriz() {
            // 1. Criamos a matriz pré-preenchida no JavaScript com os mesmos números da tabela
            let matriz = [
                [10, 20, 30],
                [40, 50, 60],
                [70, 80, 90]
            ];

            // 2. Pegamos os valores da diagonal principal usando os índices [linha][coluna]
            let d1 = matriz[0][0]; // Linha 0, Coluna 0
            let d2 = matriz[1][1]; // Linha 1, Coluna 1
            let d3 = matriz[2][2]; // Linha 2, Coluna 2

            // 3. Adicionamos a classe CSS para colorir visualmente a diagonal na tabela
            document.getElementById("celula-0-0").classList.add("diagonal-destaque");
            document.getElementById("celula-1-1").classList.add("diagonal-destaque");
            document.getElementById("celula-2-2").classList.add("diagonal-destaque");

            // 4. Mostramos o resultado em formato de texto abaixo
            document.getElementById("resultado").innerHTML = 
                "Elementos da Diagonal Principal: <br><br>" + 
                "<span style='color: #4caf50; font-size: 24px;'>" + d1 + ", " + d2 + ", " + d3 + "</span>";
        }
    </script>

</body>
</html>
