<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
table{
width: 80%;
border-collapse: collapse;
margin: auto;
font-family: Arial;
}

caption{
font-size: 24px;
margin: 10px;
font-weight: bold;
}

th{
background-color: #222;
color: white;
padding: 12px;
}

td{
border: 1px solid #999;
padding: 10px;
text-align: center;
}

tr:nth-child(even){
background-color: #f0f0f0;
}

tr:hover{
background-color: lightblue;
}

.formulario{
width: 80%;
margin: 20px auto;
font-family: Arial;
}

input{
padding: 8px;
margin: 5px;
}

button{
padding: 8px 15px;
background-color: #222;
color: white;
border: none;
cursor: pointer;
}

button:hover{
background-color: #444;
}
</style>

<title>Tabela HTML5</title>
</head>

<body>

<!-- FORMULÁRIO -->
<div class="formulario">
<input type="text" id="produto" placeholder="Digite o produto">

<input type="number" id="quantidade" placeholder="Digite a quantidade">

<input type="text" id="local" placeholder="Digite o local">

<button onclick="adicionaProduto()">
Adicionar
</button>
</div>

<!-- TABELA -->
<table>

<caption>Controle de Estoque</caption>

<thead>
<tr>
<th>Nome</th>
<th>Quantidade</th>
<th>Localização</th>
</tr>
</thead>

<tbody id="tabelaAlunos">

<tr>
<td>Fanta Uva</td>
<td>250</td>
<td>B15</td>
</tr>

<tr>
<td>Coca</td>
<td>200</td>
<td>B14</td>
</tr>

<tr>
<td>Pepsi</td>
<td>500</td>
<td>C20</td>
</tr>

</tbody>
</table>

<!-- JAVASCRIPT -->
<script>

function adicionarProdutos(){

// PEGAR OS DADOS DOS INPUTS
let produto = document.getElementById("produto").value;
let quantidade = document.getElementById("quantidade").value;
let curso = document.getElementById("curso").value;

// VALIDAR CAMPOS
if(produto == "" || quantidade == "" || local == ""){
alert("Preencha todos os campos!");
return;
}

// PEGAR A TABELA
let tabela = document.getElementById("tabelaProdutos");

// CRIAR UMA NOVA LINHA
let novaLinha = tabela.insertRow();

// CRIAR AS CÉLULAS
let celulaProduto = novaLinha.insertCell(0);
let celulaQuantidade = novaLinha.insertCell(1);
let celulaLocal = novaLinha.insertCell(2);

// INSERIR OS DADOS

celulaLocal.innerHTML = curso;

// LIMPAR OS CAMPOS
document.getElementById("produto").value = "";
document.getElementById("quantidade").value = "";
document.getElementById("local").value = "";

}

</script>

</body>
</html>
